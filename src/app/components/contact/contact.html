<div id="contact">
  <div class="container">
    <div class="row">
      <div class="contact-left">
        <h1 class="sub-title">Contact Me</h1>
        <p><i class="fa-solid fa-paper-plane"></i> mkramatsui&#64;icloud.com</p>
        <p><i class="fa-solid fa-envelope"></i> keneilwempho15&#64;gmail.com</p>
        <div class="social-icons">
          <a href="https://www.linkedin.com/in/keneilwe-mpho-ramatsui/" target="_blank" aria-label="LinkedIn">
            <i class="fa-brands fa-linkedin"></i>
          </a>
          <a href="https://github.com/KMphoR" target="_blank" aria-label="GitHub">
            <i class="fa-brands fa-github"></i>
          </a>
        </div>
        <a href="images/KENEILWE MPHO RAMATSUI_CV().pdf" download class="btn btn2">Download CV</a>
      </div>
      <div class="contact-right">
        <form (submit)="onSubmit($event)">
          <div class="field-wrap">
            <input type="text" name="Name" placeholder="Your Name" required [(ngModel)]="formData.name"
              [class.invalid]="formData.name.length > 0 && formData.name.trim().length < 2"
              [class.valid]="formData.name.trim().length >= 2">
            <i class="fa-solid fa-circle-check field-valid-icon" *ngIf="formData.name.trim().length >= 2"></i>
            <div class="field-error-bubble" *ngIf="formData.name.length > 0 && formData.name.trim().length < 2">
              <i class="fa-solid fa-circle-xmark"></i> Name is too short
            </div>
          </div>
          <div class="field-wrap">
            <input type="email" name="Email" placeholder="Your Email" required [(ngModel)]="formData.email"
              [class.invalid]="formData.email.length > 0 && !isEmailValid()"
              [class.valid]="formData.email.length > 0 && isEmailValid()">
            <i class="fa-solid fa-circle-check field-valid-icon" *ngIf="formData.email.length > 0 && isEmailValid()"></i>
            <div class="field-error-bubble" *ngIf="formData.email.length > 0 && !isEmailValid()">
              <i class="fa-solid fa-circle-xmark"></i> Hmm, that doesn't look like a valid email
            </div>
          </div>
          <textarea name="Message" rows="10" placeholder="Your Message" [(ngModel)]="formData.message"></textarea>
          <button type="submit" class="btn btn2" [disabled]="!isFormValid()">Submit</button>
        </form>
        @if (successMsg) {
          <span class="msg" [class.error]="successMsg.includes('wrong')">{{ successMsg }}</span>
        }
      </div>
    </div>
  </div>
  <div class="copyright">
    <p>
      <i class="fa-solid fa-laptop-code"></i>
      Keneilwe Mpho Ramatsui
      <i class="fa-regular fa-copyright"></i>
      {{ year }}
    </p>
  </div>
</div>
